<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carteras SPL</title>
<style>
:root{--azul:#1F3864;--azul2:#2d5299;--verde:#1D6A27;--verde-bg:#e8f5e9;--rojo:#A32D2D;--rojo-bg:#fce4e4;--gris:#f4f6f9;--texto:#222;--borde:#dde3ed;--naranja:#e65100;--naranja-bg:#fff3e0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gris);color:var(--texto);min-height:100vh}
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--azul) 0%,var(--azul2) 100%)}
.login-logo{font-size:2rem;font-weight:800;color:white;letter-spacing:2px;margin-bottom:6px}
.login-sub{color:rgba(255,255,255,.65);font-size:.85rem;margin-bottom:36px}
.login-box{background:white;border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-box h2{font-size:1.1rem;color:var(--azul);margin-bottom:20px}
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:.75rem;font-weight:600;color:#666;margin-bottom:5px;text-transform:uppercase}
.input-group input{width:100%;padding:12px 14px;border:1.5px solid var(--borde);border-radius:10px;font-size:1rem;outline:none}
.input-group input:focus{border-color:var(--azul2)}
.btn-login{width:100%;padding:14px;background:var(--azul);color:white;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px}
.login-error{color:var(--rojo);font-size:.85rem;margin-top:10px;text-align:center;display:none}
#app-screen{display:none}
#admin-screen{display:none}
.topbar{background:var(--azul);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-title{font-weight:700;font-size:1rem}
.topbar-user{font-size:.8rem;opacity:.75}
.btn-logout{background:rgba(255,255,255,.15);border:none;color:white;padding:6px 12px;border-radius:8px;font-size:.8rem;cursor:pointer}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 12px 0}
.stat-card{background:white;border-radius:12px;padding:12px 10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--azul)}
.stat-num.verde{color:var(--verde)}
.stat-num.rojo{color:var(--rojo)}
.stat-lbl{font-size:.68rem;color:#888;margin-top:2px}
.filters{padding:12px;display:flex;gap:8px;flex-wrap:wrap}
.search-box{width:100%;padding:10px 14px;border:1.5px solid var(--borde);border-radius:10px;font-size:.95rem;outline:none}
.filter-btns{display:flex;gap:6px;width:100%}
.fbtn{flex:1;padding:9px 4px;border:1.5px solid var(--borde);border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;background:white;color:#555}
.fbtn.active-all{background:var(--azul);color:white;border-color:var(--azul)}
.fbtn.active-activo{background:var(--verde-bg);color:var(--verde);border-color:var(--verde)}
.fbtn.active-inact{background:var(--rojo-bg);color:var(--rojo);border-color:var(--rojo)}
.list-count{padding:0 12px 6px;font-size:.78rem;color:#888}
.cliente-list{padding:0 12px 80px;display:flex;flex-direction:column;gap:10px}
.cliente-card{background:white;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--borde);cursor:pointer}
.cliente-card.activo{border-left-color:var(--verde)}
.cliente-card.inactivo{border-left-color:var(--rojo)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-nombre{font-weight:700;font-size:.92rem;line-height:1.3;flex:1}
.badge{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge.activo{background:var(--verde-bg);color:var(--verde)}
.badge.inactivo{background:var(--rojo-bg);color:var(--rojo)}
.card-meta{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.meta-item{font-size:.75rem;color:#777}
.card-total{margin-top:6px;font-size:.8rem;color:var(--azul);font-weight:600}
.card-nota-preview{margin-top:6px;font-size:.75rem;color:#888;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px 16px 40px}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.modal-nombre{font-size:1.1rem;font-weight:800;color:var(--azul);margin-bottom:4px}
.modal-ubicacion{font-size:.82rem;color:#888;margin-bottom:14px}
.modal-section{margin-bottom:16px}
.modal-section-title{font-size:.7rem;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;border-bottom:1px solid var(--borde);padding-bottom:4px}
.contact-btns{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;text-decoration:none;border:none;cursor:pointer}
.cbtn.tel{background:#e3f2fd;color:#1565c0}
.cbtn.wa{background:#e8f5e9;color:#2e7d32}
.cbtn.mail{background:#fff3e0;color:#e65100}
.cbtn.maps{background:#f3e5f5;color:#6a1b9a}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:var(--gris);border-radius:10px;padding:10px 12px}
.info-item.full{grid-column:1/-1}
.info-label{font-size:.65rem;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.info-value{font-size:.88rem;font-weight:600;color:var(--texto)}
.seguimiento-fields{display:flex;flex-direction:column;gap:10px}
.seg-group label{display:block;font-size:.72rem;font-weight:600;color:#888;margin-bottom:4px;text-transform:uppercase}
.seg-group select,.seg-group input,.seg-group textarea{width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:.9rem;font-family:inherit;outline:none;background:white}
.seg-group textarea{resize:vertical;min-height:72px}
.btn-guardar{width:100%;padding:14px;background:var(--azul);color:white;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px}
.save-ok{text-align:center;color:var(--verde);font-size:.85rem;margin-top:8px;display:none}
.empty-state{text-align:center;padding:48px 24px;color:#aaa}
/* ADMIN */
.admin-tabs{display:flex;background:white;border-bottom:2px solid var(--borde);position:sticky;top:56px;z-index:90}
.atab{flex:1;padding:12px 4px;text-align:center;font-size:.82rem;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.atab.active{color:var(--azul);border-bottom-color:var(--azul)}
.admin-content{padding:12px}
.vendedor-card{background:white;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer}
.vendedor-header{display:flex;justify-content:space-between;align-items:center}
.vendedor-nombre{font-weight:700;font-size:.95rem;color:var(--azul)}
.vendedor-stats{display:flex;gap:8px;margin-top:8px}
.vstat{font-size:.75rem;padding:3px 8px;border-radius:6px;font-weight:600}
.vstat.total{background:#eef2ff;color:var(--azul)}
.vstat.act{background:var(--verde-bg);color:var(--verde)}
.vstat.inact{background:var(--rojo-bg);color:var(--rojo)}
.vstat.notas{background:var(--naranja-bg);color:var(--naranja)}
.nota-card{background:white;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:3px solid var(--azul)}
.nota-vendedor{font-size:.7rem;color:var(--azul);font-weight:700;text-transform:uppercase;margin-bottom:2px}
.nota-cliente{font-weight:700;font-size:.9rem;margin-bottom:4px}
.nota-detalle{font-size:.78rem;color:#666;display:flex;flex-direction:column;gap:2px}
.nota-tag{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:10px;font-weight:600;margin-right:4px;margin-top:3px}
.nota-tag.etapa{background:#eef2ff;color:var(--azul)}
.nota-tag.resultado{background:var(--verde-bg);color:var(--verde)}
.back-btn{background:none;border:none;color:white;font-size:1.2rem;cursor:pointer;padding:0 8px 0 0}
.loading{text-align:center;padding:40px;color:#aaa}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">SPL</div>
  <div class="login-sub">Distribuidora &mdash; Carteras de Clientes</div>
  <div class="login-box">
    <h2>Ingres&aacute; a tu cartera</h2>
    <div class="input-group">
      <label>Usuario</label>
      <input type="text" id="inp-user" placeholder="tu nombre" autocomplete="username" autocapitalize="none">
    </div>
    <div class="input-group">
      <label>Contrase&ntilde;a</label>
      <input type="password" id="inp-pass" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error">Usuario o contrase&ntilde;a incorrectos</div>
  </div>
</div>

<!-- APP VENDEDOR -->
<div id="app-screen">
  <div class="topbar">
    <div>
      <div class="topbar-title">Mis Clientes</div>
      <div class="topbar-user" id="topbar-user"></div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Salir</button>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="st-total">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-num verde" id="st-activos">0</div><div class="stat-lbl">Activos</div></div>
    <div class="stat-card"><div class="stat-num rojo" id="st-inactivos">0</div><div class="stat-lbl">Inactivos</div></div>
  </div>
  <div class="filters">
    <input class="search-box" type="text" id="search-input" placeholder="&#128269; Buscar cliente, ciudad..." oninput="renderList()">
    <div class="filter-btns">
      <button class="fbtn active-all" id="fbtn-all" onclick="setFilter('all')">Todos</button>
      <button class="fbtn" id="fbtn-activo" onclick="setFilter('Activo')">&#9989; Activos</button>
      <button class="fbtn" id="fbtn-inactivo" onclick="setFilter('Inactivo')">&#128308; Inactivos</button>
    </div>
  </div>
  <div class="list-count" id="list-count"></div>
  <div class="cliente-list" id="cliente-list"></div>
</div>

<!-- APP ADMIN -->
<div id="admin-screen">
  <div class="topbar" id="admin-topbar">
    <div style="display:flex;align-items:center;gap:4px">
      <button class="back-btn" id="admin-back-btn" onclick="adminBack()" style="display:none">&#8592;</button>
      <div>
        <div class="topbar-title" id="admin-title">Panel Admin</div>
        <div class="topbar-user">Federico &mdash; Administrador</div>
      </div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Salir</button>
  </div>
  <div class="admin-tabs" id="admin-tabs">
    <div class="atab active" id="tab-vendedores" onclick="adminTab('vendedores')">Por Vendedor</div>
    <div class="atab" id="tab-notas" onclick="adminTab('notas')">Todas las Notas</div>
  </div>
  <div class="admin-content" id="admin-content">
    <div class="loading">Cargando...</div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-nombre" id="m-nombre"></div>
    <div class="modal-ubicacion" id="m-ubicacion"></div>
    <div class="modal-section">
      <div class="modal-section-title">&#128222; Contacto r&aacute;pido</div>
      <div class="contact-btns" id="m-contact-btns"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">&#128203; Datos del cliente</div>
      <div class="info-grid" id="m-info-grid"></div>
    </div>
    <div class="modal-section" id="seguimiento-section">
      <div class="modal-section-title">&#128221; Seguimiento</div>
      <div class="seguimiento-fields">
        <div class="seg-group"><label>Etapa</label>
          <select id="seg-etapa">
            <option>1. Localizar</option><option>2. Calificar</option>
            <option>3. Contactar</option><option>4. Cotizar / Visitar</option>
            <option>5. Recuperado &#10003;</option>
          </select>
        </div>
        <div class="seg-group"><label>V&iacute;a de contacto</label>
          <select id="seg-via">
            <option value="">-</option><option>WhatsApp</option>
            <option>Llamada</option><option>Email</option><option>Visita</option>
          </select>
        </div>
        <div class="seg-group"><label>Resultado / Inter&eacute;s</label>
          <select id="seg-resultado">
            <option value="">-</option><option>Sin respuesta</option>
            <option>Interesado</option><option>No interesado</option>
            <option>Pidi&oacute; cotizaci&oacute;n</option>
            <option>Prometi&oacute; llamar</option><option>Compr&oacute; &#10003;</option>
          </select>
        </div>
        <div class="seg-group"><label>Fecha contacto</label>
          <input type="date" id="seg-fecha">
        </div>
        <div class="seg-group"><label>Pr&oacute;xima acci&oacute;n</label>
          <input type="text" id="seg-proxima" placeholder="ej: Llamar el lunes">
        </div>
        <div class="seg-group"><label>Comentarios</label>
          <textarea id="seg-comentarios" placeholder="Notas libres..."></textarea>
        </div>
      </div>
      <button class="btn-guardar" id="btn-guardar" onclick="guardarNota()">&#128190; Guardar</button>
      <div class="save-ok" id="save-ok">&#10003; Guardado correctamente</div>
    </div>
  </div>
</div>

var currentUser = null;
var currentUserKey = null;
var currentRol = null;
var currentClientes = [];
var currentFilter = 'all';
var currentModalIdx = null;
var currentModalVendedor = null;
var notas = {};
var adminCurrentView = 'vendedores';
var adminCurrentVendedor = null;
var allNotasCache = {};
var isAdminViewingVendedor = false;

// ── LOGIN ──
window.doLogin = function() {
  var u = document.getElementById('inp-user').value.trim().toLowerCase();
  var p = document.getElementById('inp-pass').value.trim();
  var err = document.getElementById('login-error');
  if (APP_DATA.usuarios[u] && APP_DATA.usuarios[u].clave === p) {
    currentUserKey = u;
    currentUser = APP_DATA.usuarios[u].nombre_completo;
    currentRol = APP_DATA.usuarios[u].rol;
    err.style.display = 'none';
    if (currentRol === 'admin') {
      showAdmin();
    } else {
      loadNotasVendedor(u, function() { showApp(); });
    }
  } else {
    err.style.display = 'block';
  }
}

document.getElementById('inp-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') window.doLogin();
});

window.doLogout = function() {
  currentUser = null; currentUserKey = null; currentRol = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('inp-user').value = '';
  document.getElementById('inp-pass').value = '';
}

// ── FIREBASE NOTAS ──
function loadNotasVendedor(userKey, callback) {
  var r = ref(db, 'notas/' + userKey);
  get(r).then(function(snap) {
    notas = snap.exists() ? snap.val() : {};
    if (callback) callback();
  }).catch(function() { notas = {}; if (callback) callback(); });
}

function saveNota(userKey, clienteNombre, notaObj) {
  var key = clienteNombre.replace(/[.#$[\]]/g, '_');
  set(ref(db, 'notas/' + userKey + '/' + key), notaObj);
  notas[clienteNombre] = notaObj;
}

// ── APP VENDEDOR ──
function showApp() {
  currentClientes = APP_DATA.clientes[currentUser] || [];
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('topbar-user').textContent = currentUser;
  var activos   = currentClientes.filter(function(c){ return c.estado === 'Activo'; }).length;
  var inactivos = currentClientes.filter(function(c){ return c.estado === 'Inactivo'; }).length;
  document.getElementById('st-total').textContent     = currentClientes.length;
  document.getElementById('st-activos').textContent   = activos;
  document.getElementById('st-inactivos').textContent = inactivos;
  renderList();
}

window.setFilter = function(f) {
  currentFilter = f;
  document.getElementById('fbtn-all').className     = 'fbtn';
  document.getElementById('fbtn-activo').className  = 'fbtn';
  document.getElementById('fbtn-inactivo').className= 'fbtn';
  if (f === 'all')      document.getElementById('fbtn-all').className     = 'fbtn active-all';
  if (f === 'Activo')   document.getElementById('fbtn-activo').className  = 'fbtn active-activo';
  if (f === 'Inactivo') document.getElementById('fbtn-inactivo').className= 'fbtn active-inact';
  renderList();
}

function fmt(n) { if (!n) return '$0'; return '$' + Math.round(n).toLocaleString('es-AR'); }

function renderList() {
  var q    = document.getElementById('search-input').value.toLowerCase();
  var list = document.getElementById('cliente-list');
  var filtered = [];
  for (var i = 0; i < currentClientes.length; i++) {
    var c = currentClientes[i];
    if (currentFilter !== 'all' && c.estado !== currentFilter) continue;
    if (q && c.nombre.toLowerCase().indexOf(q) === -1 &&
             c.ciudad.toLowerCase().indexOf(q) === -1) continue;
    filtered.push({c: c, idx: i});
  }
  document.getElementById('list-count').textContent = filtered.length + ' cliente' + (filtered.length !== 1 ? 's' : '');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div style="font-size:3rem">&#128269;</div><br>Sin resultados</div>';
    return;
  }
  var html = '';
  for (var j = 0; j < filtered.length; j++) {
    var c = filtered[j].c; var idx = filtered[j].idx;
    var notaKey = c.nombre.replace(/[.#$[\]]/g, '_');
    var n = notas[notaKey] || notas[c.nombre] || {};
    var extra = '';
    if (n.etapa && n.etapa !== '1. Localizar') extra += '<div class="card-nota-preview">&#128205; ' + n.etapa + '</div>';
    else if (n.comentarios) extra += '<div class="card-nota-preview">&#128172; ' + n.comentarios + '</div>';
    var ubicacion = [c.ciudad, c.provincia].filter(function(x){ return x; }).join(' &mdash; ');
    html += '<div class="cliente-card ' + c.estado.toLowerCase() + '" onclick="openModal(' + idx + ',null)">';
    html += '<div class="card-header"><div class="card-nombre">' + c.nombre + '</div>';
    html += '<span class="badge ' + c.estado.toLowerCase() + '">' + c.estado + '</span></div>';
    if (ubicacion) html += '<div class="card-meta"><span class="meta-item">&#128205; ' + ubicacion + '</span></div>';
    if (c.ultima_compra) html += '<div class="card-meta"><span class="meta-item">&#128197; ' + c.ultima_compra + '</span></div>';
    if (c.total_facturado) html += '<div class="card-total">&#128176; ' + fmt(c.total_facturado) + '</div>';
    html += extra + '</div>';
  }
  list.innerHTML = html;
}

// ── ADMIN ──
function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  loadAllNotas(function() { renderAdminVendedores(); });
}

function loadAllNotas(callback) {
  get(ref(db, 'notas')).then(function(snap) {
    allNotasCache = snap.exists() ? snap.val() : {};
    if (callback) callback();
  }).catch(function() { allNotasCache = {}; if (callback) callback(); });
}

window.adminTab = function(tab) {
  adminCurrentView = tab;
  adminCurrentVendedor = null;
  document.getElementById('tab-vendedores').className = 'atab' + (tab === 'vendedores' ? ' active' : '');
  document.getElementById('tab-notas').className = 'atab' + (tab === 'notas' ? ' active' : '');
  document.getElementById('admin-back-btn').style.display = 'none';
  document.getElementById('admin-title').textContent = 'Panel Admin';
  if (tab === 'vendedores') renderAdminVendedores();
  else renderAdminNotas(null);
}

function countNotas(userKey) {
  var n = allNotasCache[userKey] || {};
  return Object.keys(n).filter(function(k) {
    var nota = n[k];
    return nota && (nota.etapa !== '1. Localizar' || nota.comentarios || nota.resultado);
  }).length;
}

function renderAdminVendedores() {
  var vendedores = Object.keys(APP_DATA.clientes);
  var html = '';
  for (var i = 0; i < vendedores.length; i++) {
    var v = vendedores[i];
    var cls = APP_DATA.clientes[v];
    var activos   = cls.filter(function(c){ return c.estado === 'Activo'; }).length;
    var inactivos = cls.filter(function(c){ return c.estado === 'Inactivo'; }).length;
    var userKey = v.split(' ')[0].toLowerCase();
    var nNotas  = countNotas(userKey);
    html += '<div class="vendedor-card" onclick="adminVerVendedor('' + v.replace(/'/g,"\'") + '')">';
    html += '<div class="vendedor-header"><div class="vendedor-nombre">' + v + '</div><span style="font-size:1.2rem">&#8250;</span></div>';
    html += '<div class="vendedor-stats">';
    html += '<span class="vstat total">' + cls.length + ' clientes</span>';
    html += '<span class="vstat act">' + activos + ' activos</span>';
    html += '<span class="vstat inact">' + inactivos + ' inactivos</span>';
    if (nNotas > 0) html += '<span class="vstat notas">' + nNotas + ' notas</span>';
    html += '</div></div>';
  }
  document.getElementById('admin-content').innerHTML = html;
}

window.adminVerVendedor = function(vendedor) {
  adminCurrentVendedor = vendedor;
  isAdminViewingVendedor = true;
  document.getElementById('admin-back-btn').style.display = 'inline';
  document.getElementById('admin-title').textContent = vendedor.split(' ')[0];
  document.getElementById('admin-tabs').style.display = 'none';
  var userKey = vendedor.split(' ')[0].toLowerCase();
  var vNotas = allNotasCache[userKey] || {};
  var cls = APP_DATA.clientes[vendedor] || [];
  currentClientes = cls;
  // Cargar notas de este vendedor para el modal
  notas = {};
  for (var k in vNotas) { notas[k] = vNotas[k]; }
  var activos   = cls.filter(function(c){ return c.estado === 'Activo'; }).length;
  var inactivos = cls.filter(function(c){ return c.estado === 'Inactivo'; }).length;
  var html = '<div class="stats-row" style="padding:0 0 14px">';
  html += '<div class="stat-card"><div class="stat-num">' + cls.length + '</div><div class="stat-lbl">Total</div></div>';
  html += '<div class="stat-card"><div class="stat-num verde">' + activos + '</div><div class="stat-lbl">Activos</div></div>';
  html += '<div class="stat-card"><div class="stat-num rojo">' + inactivos + '</div><div class="stat-lbl">Inactivos</div></div>';
  html += '</div>';
  for (var i = 0; i < cls.length; i++) {
    var c = cls[i];
    var notaKey = c.nombre.replace(/[.#$[\]]/g, '_');
    var n = vNotas[notaKey] || vNotas[c.nombre] || {};
    var extra = '';
    if (n.etapa && n.etapa !== '1. Localizar') extra += '<div class="card-nota-preview">&#128205; ' + n.etapa + '</div>';
    if (n.comentarios) extra += '<div class="card-nota-preview">&#128172; ' + n.comentarios + '</div>';
    if (n.resultado) extra += '<div class="card-nota-preview">&#128200; ' + n.resultado + '</div>';
    html += '<div class="cliente-card ' + c.estado.toLowerCase() + '" onclick="openModal(' + i + ','' + vendedor.replace(/'/g,"\'") + '')">';
    html += '<div class="card-header"><div class="card-nombre">' + c.nombre + '</div>';
    html += '<span class="badge ' + c.estado.toLowerCase() + '">' + c.estado + '</span></div>';
    if (c.ciudad) html += '<div class="card-meta"><span class="meta-item">&#128205; ' + c.ciudad + '</span></div>';
    if (c.ultima_compra) html += '<div class="card-meta"><span class="meta-item">&#128197; ' + c.ultima_compra + '</span></div>';
    if (c.total_facturado) html += '<div class="card-total">&#128176; ' + fmt(c.total_facturado) + '</div>';
    html += extra + '</div>';
  }
  document.getElementById('admin-content').innerHTML = html;
}

window.adminBack = function() {
  isAdminViewingVendedor = false;
  adminCurrentVendedor = null;
  document.getElementById('admin-back-btn').style.display = 'none';
  document.getElementById('admin-title').textContent = 'Panel Admin';
  document.getElementById('admin-tabs').style.display = 'flex';
  if (adminCurrentView === 'vendedores') renderAdminVendedores();
  else renderAdminNotas(null);
}

function renderAdminNotas(filtroVendedor) {
  var html = '';
  var vendedores = Object.keys(APP_DATA.clientes);
  var total = 0;
  for (var i = 0; i < vendedores.length; i++) {
    var v = filtroVendedor || vendedores[i];
    var userKey = v.split(' ')[0].toLowerCase();
    var vNotas = allNotasCache[userKey] || {};
    var cls = APP_DATA.clientes[v] || [];
    for (var j = 0; j < cls.length; j++) {
      var c = cls[j];
      var notaKey = c.nombre.replace(/[.#$[\]]/g, '_');
      var n = vNotas[notaKey] || vNotas[c.nombre] || {};
      if (!n.etapa && !n.comentarios && !n.resultado) continue;
      if (n.etapa === '1. Localizar' && !n.comentarios && !n.resultado) continue;
      total++;
      html += '<div class="nota-card">';
      html += '<div class="nota-vendedor">&#128100; ' + v + '</div>';
      html += '<div class="nota-cliente">' + c.nombre + '</div>';
      html += '<div class="nota-detalle">';
      if (n.etapa)      html += '<span class="nota-tag etapa">' + n.etapa + '</span>';
      if (n.resultado)  html += '<span class="nota-tag resultado">' + n.resultado + '</span>';
      if (n.via)        html += '<span style="font-size:.75rem;color:#888">Via: ' + n.via + '</span>';
      if (n.fecha)      html += '<span style="font-size:.75rem;color:#888">Fecha: ' + n.fecha + '</span>';
      if (n.proxima)    html += '<span style="font-size:.75rem;color:#555">Prox: ' + n.proxima + '</span>';
      if (n.comentarios)html += '<span style="font-size:.78rem;color:#444;font-style:italic">"' + n.comentarios + '"</span>';
      html += '</div></div>';
    }
    if (filtroVendedor) break;
  }
  if (!total) html = '<div class="empty-state"><div style="font-size:3rem">&#128221;</div><br>No hay notas cargadas a&uacute;n</div>';
  document.getElementById('admin-content').innerHTML = html;
}

// ── MODAL ──
window.openModal = function(idx, vendedor) {
  currentModalIdx = idx;
  currentModalVendedor = vendedor;
  var cls = vendedor ? (APP_DATA.clientes[vendedor] || []) : currentClientes;
  var c = cls[idx];
  var vNotas = notas;
  if (vendedor) {
    var userKey = vendedor.split(' ')[0].toLowerCase();
    vNotas = allNotasCache[userKey] || {};
  }
  var notaKey = c.nombre.replace(/[.#$[\]]/g, '_');
  var n = vNotas[notaKey] || vNotas[c.nombre] || {};

  document.getElementById('m-nombre').textContent = c.nombre;
  var ubicParts = [];
  if (c.direccion) ubicParts.push(c.direccion);
  if (c.ciudad)    ubicParts.push(c.ciudad);
  if (c.provincia) ubicParts.push(c.provincia);
  document.getElementById('m-ubicacion').textContent = ubicParts.join(', ');

  var btns = '';
  var tel = c.movil || c.telefono;
  if (tel) {
    var t = tel.replace(/[^0-9]/g,'');
    btns += '<a class="cbtn tel" href="tel:' + t + '">&#128222; Llamar</a>';
    btns += '<a class="cbtn wa" href="https://wa.me/549' + t + '" target="_blank">&#128172; WhatsApp</a>';
  }
  if (c.email) {
    var em = c.email.split(';')[0].trim();
    btns += '<a class="cbtn mail" href="mailto:' + em + '">&#9993; Email</a>';
  }
  if (c.direccion && c.ciudad) {
    var mapsQ = encodeURIComponent(c.direccion + ' ' + c.ciudad);
    btns += '<a class="cbtn maps" href="https://maps.google.com/?q=' + mapsQ + '" target="_blank">&#128205; Maps</a>';
  }
  document.getElementById('m-contact-btns').innerHTML = btns || '<span style="color:#aaa;font-size:.85rem">Sin datos de contacto</span>';

  var colorEstado = c.estado === 'Activo' ? 'var(--verde)' : 'var(--rojo)';
  var grid = '';
  grid += '<div class="info-item"><div class="info-label">Estado</div><div class="info-value" style="color:' + colorEstado + '">' + c.estado + '</div></div>';
  grid += '<div class="info-item"><div class="info-label">&#218;ltima compra</div><div class="info-value">' + (c.ultima_compra || '-') + '</div></div>';
  if (c.direccion) grid += '<div class="info-item full"><div class="info-label">Direcci&oacute;n</div><div class="info-value">' + c.direccion + '</div></div>';
  if (c.ciudad)    grid += '<div class="info-item"><div class="info-label">Ciudad</div><div class="info-value">' + c.ciudad + '</div></div>';
  if (c.provincia) grid += '<div class="info-item"><div class="info-label">Provincia</div><div class="info-value">' + c.provincia + '</div></div>';
  if (c.telefono)  grid += '<div class="info-item"><div class="info-label">Tel&eacute;fono</div><div class="info-value">' + c.telefono + '</div></div>';
  if (c.movil)     grid += '<div class="info-item"><div class="info-label">M&oacute;vil</div><div class="info-value">' + c.movil + '</div></div>';
  if (c.email)     grid += '<div class="info-item full"><div class="info-label">Email</div><div class="info-value" style="font-size:.78rem;word-break:break-all">' + c.email + '</div></div>';
  grid += '<div class="info-item full"><div class="info-label">Total facturado</div><div class="info-value" style="color:var(--azul)">' + fmt(c.total_facturado) + '</div></div>';
  document.getElementById('m-info-grid').innerHTML = grid;

  // Si es admin viendo un vendedor, ocultar botón guardar
  var esAdminViendo = (currentRol === 'admin');
  document.getElementById('btn-guardar').style.display = esAdminViendo ? 'none' : 'block';

  document.getElementById('seg-etapa').value      = n.etapa      || '1. Localizar';
  document.getElementById('seg-via').value         = n.via        || '';
  document.getElementById('seg-resultado').value   = n.resultado  || '';
  document.getElementById('seg-fecha').value       = n.fecha      || '';
  document.getElementById('seg-proxima').value     = n.proxima    || '';
  document.getElementById('seg-comentarios').value = n.comentarios|| '';
  document.getElementById('save-ok').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal').scrollTop = 0;
}

window.closeModalOutside = function(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

window.guardarNota = function() {
  var c = currentClientes[currentModalIdx];
  var notaObj = {
    etapa:       document.getElementById('seg-etapa').value,
    via:         document.getElementById('seg-via').value,
    resultado:   document.getElementById('seg-resultado').value,
    fecha:       document.getElementById('seg-fecha').value,
    proxima:     document.getElementById('seg-proxima').value,
    comentarios: document.getElementById('seg-comentarios').value
  };
  saveNota(currentUserKey, c.nombre, notaObj);
  document.getElementById('save-ok').style.display = 'block';
  setTimeout(function() {
    document.getElementById('save-ok').style.display = 'none';
    closeModal();
    renderList();
  }, 1200);
}
